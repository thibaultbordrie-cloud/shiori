name: ci

on:
  push:
  pull_request:

# Least privilege: the default token can only read the repository.
permissions:
  contents: read

env:
  KOTLIN_VERSION: "2.2.21"
  # SHA-256 of kotlin-compiler-2.2.21.zip from JetBrains' GitHub release: the build stops if it differs.
  KOTLIN_SHA256: a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Kotlin compiler (checked by SHA-256)
        run: |
          curl -fsSL -o kotlinc.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  kotlinc.zip" | sha256sum -c -
          unzip -q kotlinc.zip -d "$RUNNER_TEMP"
      - name: Build and test (warnings are errors)
        run: KOTLINC="$RUNNER_TEMP/kotlinc/bin/kotlinc" sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/*.jar

  # The jar runs anywhere Java 21 runs: the same tests and a demo shop on three systems.
  run:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: build
      - name: Tests
        run: java -cp build/shiori-tests.jar shiori.CheckKt
      - name: Demo shops in the four markets, and their journals
        shell: bash
        run: |
          for m in fr jp tw kr; do
            java -jar build/shiori.jar demo --market $m --data "demo-$m"
            java -jar build/shiori.jar verify --data "demo-$m"
          done
