name: release

# Builds the jar when a release is published and attaches it: `java -jar shiori-<version>.jar`.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  KOTLIN_VERSION: "2.2.21"
  KOTLIN_SHA256: a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Kotlin compiler (checked by SHA-256)
        run: |
          curl -fsSL -o kotlinc.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  kotlinc.zip" | sha256sum -c -
          unzip -q kotlinc.zip -d "$RUNNER_TEMP"
      - run: KOTLINC="$RUNNER_TEMP/kotlinc/bin/kotlinc" sh build.sh
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp build/shiori.jar "shiori-${TAG#v}.jar"
          sha256sum "shiori-${TAG#v}.jar" > "shiori-${TAG#v}.jar.sha256"
          gh release upload "$TAG" "shiori-${TAG#v}.jar" "shiori-${TAG#v}.jar.sha256" --clobber
